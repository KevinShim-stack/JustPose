<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0B0D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Just Pose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- gif.js: pure client-side GIF encoder used by the "GIF 만들기" feature in
     the gallery. No server involved — frames are rendered locally and
     encoded via a Web Worker. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
  :root{
    --bg:#0A0B0D;
    --card:#15171B;
    --line:#2A2D33;
    --accent:#C8FF3D;
    --accent-dim:#8fb32a;
    --alert:#FF5B4C;
    --text:#F3F4F1;
    --muted:#888D95;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family:'Space Grotesk',sans-serif; overflow:hidden;
    -webkit-user-select:none;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}

  /* ---------- Camera stage ---------- */
  #stage{position:relative; flex:1; overflow:hidden; background:#000;}
  video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transform:scaleX(1);
  }
  video.mirror{ transform:scaleX(-1); }
  canvas#work{display:none;}
  canvas#capture{display:none;}

  #flash{
    position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;
    transition:opacity .08s ease;
  }

  #toast{
    position:absolute; left:50%; top:74px; z-index:50;
    transform:translateX(-50%) translateY(-8px);
    display:flex; align-items:center; gap:8px;
    background:rgba(21,23,27,0.95); border:1px solid var(--line);
    border-radius:999px; padding:10px 18px;
    font-size:14px; font-weight:600; color:var(--text);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    white-space:nowrap;
  }
  #toast .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; }

  #countdownOverlay{
    position:absolute; inset:0; z-index:6; display:none;
    align-items:center; justify-content:center; pointer-events:none;
    background:rgba(0,0,0,.18);
  }
  #countdownNum{
    font-family:'Archivo Black',sans-serif; font-size:130px; color:var(--text);
    text-shadow:0 4px 26px rgba(0,0,0,.65);
  }

  /* ---------- Framing guide / position lock ---------- */
  #poseGuide{
    position:absolute; inset:0; z-index:3; pointer-events:none;
    opacity:1; transition:opacity .2s ease;
  }
  #poseGuide .headGuide{
    position:absolute; left:50%; top:17%; transform:translateX(-50%);
    width:92px; height:116px; border:2px solid rgba(200,255,61,.78);
    border-radius:48% 48% 45% 45%; box-shadow:0 0 18px rgba(0,0,0,.22);
  }
  #poseGuide .bodyGuide{
    position:absolute; left:50%; top:30%; transform:translateX(-50%);
    width:min(58vw,360px); height:62%; border:2px dashed rgba(255,255,255,.52);
    border-radius:45% 45% 12% 12%;
  }
  #poseGuide .guideLine{
    position:absolute; left:50%; width:min(72vw,460px); height:1px;
    transform:translateX(-50%); background:rgba(200,255,61,.55);
  }
  #poseGuide .shoulderLine{top:38%;}
  #poseGuide .centerLine{top:50%; width:1px; height:54%; left:50%; background:rgba(255,255,255,.18);}
  #poseGuide .guideLabel{
    position:absolute; left:50%; top:8%; transform:translateX(-50%);
    padding:7px 12px; border-radius:999px; background:rgba(10,11,13,.68);
    border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(7px);
    color:var(--text); font-size:12px; font-weight:700; white-space:nowrap;
  }
  #poseGuide.locked .headGuide{border-color:rgba(200,255,61,.95);}
  #poseGuide.warning .headGuide, #poseGuide.warning .bodyGuide{border-color:rgba(255,91,76,.95);}
  #poseGuide.warning .guideLine{background:rgba(255,91,76,.65);}

  @keyframes countPulse{
    0%{ transform:scale(0.4); opacity:0; }
    35%{ transform:scale(1.15); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }

  /* ---------- Top bar ---------- */
  #topbar{
    position:absolute; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;
    background:linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
  }
  .pill{
    display:flex; align-items:center; gap:6px;
    background:rgba(21,23,27,.7); border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(8px);
    padding:7px 12px; border-radius:100px; font-size:13px; font-weight:600;
  }
  .dot{width:7px; height:7px; border-radius:50%; background:var(--accent);}
  .iconbtn{
    width:38px; height:38px; border-radius:50%;
    background:rgba(21,23,27,.7); border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center;
    color:var(--text); font-size:17px;
  }

  /* ---------- Stillness ring ---------- */
  #ringWrap{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:220px; height:220px; z-index:4; pointer-events:none;
  }
  #ringWrap svg{transform:rotate(-90deg); width:100%; height:100%;}
  #ringBg{fill:none; stroke:rgba(255,255,255,.14); stroke-width:5;}
  #ringFg{
    fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round;
    stroke-dasharray:628; stroke-dashoffset:628;
    transition:stroke-dashoffset .08s linear, stroke .2s ease;
    filter:drop-shadow(0 0 8px rgba(200,255,61,.5));
  }
  #ringLabel{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; text-align:center; pointer-events:none;
  }
  #ringLabel .state{
    font-family:'Archivo Black',sans-serif; font-size:15px; letter-spacing:.04em;
    text-transform:uppercase; color:var(--text); text-shadow:0 2px 10px rgba(0,0,0,.6);
  }
  #ringLabel .sub{ font-size:12px; color:rgba(255,255,255,.75); margin-top:4px; text-shadow:0 2px 8px rgba(0,0,0,.6);}

  /* ---------- Bottom control panel ---------- */
  #bottom{
    position:absolute; left:0; right:0; bottom:0; z-index:5;
    padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
    background:linear-gradient(to top, rgba(0,0,0,.65), transparent 85%);
  }
  #strip{
    display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;
    scrollbar-width:none;
  }
  #strip::-webkit-scrollbar{display:none;}
  .thumb{
    flex:0 0 auto; width:52px; height:52px; border-radius:10px; overflow:hidden;
    border:1.5px solid rgba(255,255,255,.15); background:var(--card);
  }
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb.add{
    display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:20px;
    border-style:dashed;
  }

  #controls{ display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .ctrlbtn{
    width:46px; height:46px; border-radius:50%;
    background:rgba(21,23,27,.7); border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(8px); color:var(--text); font-size:18px;
    display:flex; align-items:center; justify-content:center;
  }
  #shutter{
    width:70px; height:70px; border-radius:50%;
    background:var(--text); border:4px solid rgba(255,255,255,.25);
    position:relative;
  }
  #shutter::after{
    content:''; position:absolute; inset:5px; border-radius:50%; background:var(--text);
  }
  #shutter.armed::after{ background:var(--accent); }

  #modeLabel{ font-size:11px; color:var(--muted); text-align:center; margin-top:8px; letter-spacing:.03em;}

  /* ---------- Sliders sheet ---------- */
  #settingsSheet, #gallerySheet, #permissionSheet{
    position:absolute; inset:0; z-index:20; background:var(--bg);
    display:none; flex-direction:column;
  }
  .sheetHead{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 14px;
    border-bottom:1px solid var(--line);
  }
  .sheetHead h2{ font-family:'Archivo Black',sans-serif; font-size:16px; margin:0; letter-spacing:.02em;}
  .sheetBody{ flex:1; overflow-y:auto; padding:20px 18px;}
  .row{ margin-bottom:26px;}
  .row label{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:10px; font-weight:600;}
  .row label span.val{ color:var(--accent); font-family:'Archivo Black',sans-serif;}
  input[type=range]{
    -webkit-appearance:none; width:100%; height:4px; border-radius:2px;
    background:var(--line); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:22px; height:22px; border-radius:50%;
    background:var(--accent); border:3px solid var(--bg); box-shadow:0 0 0 1px var(--accent);
  }
  .closebtn{
    background:none; border:none; color:var(--text); font-size:20px; padding:4px 8px;
  }

  /* gallery grid */
  #galGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .galCell{ position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; background:var(--card);}
  .galCell img{ width:100%; height:100%; object-fit:cover;}
  .galCell .date{
    position:absolute; left:4px; bottom:4px; font-size:9px; background:rgba(0,0,0,.55);
    padding:2px 5px; border-radius:5px; font-weight:600;
  }
  #galEmpty{ color:var(--muted); font-size:13px; text-align:center; margin-top:60px; line-height:1.6;}
  .galCell.selectable{ cursor:pointer; }
  .galCell .checkmark{
    position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%;
    border:2px solid rgba(255,255,255,.85); background:rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
    color:transparent;
  }
  .galCell.selected{ outline:3px solid var(--accent); outline-offset:-3px; }
  .galCell.selected .checkmark{ background:var(--accent); border-color:var(--accent); color:#0A0B0D; }
  #galSelectBar{
    display:none; justify-content:space-between; align-items:center;
    padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
    border-top:1px solid var(--line);
  }
  #galSelectBar span{ font-size:13px; color:var(--muted); font-weight:600; }
  #galDeleteSelected:disabled, #galMakeGif:disabled{ opacity:.35; }

  /* GIF maker sheet */
  #gifSheet{ position:absolute; inset:0; z-index:25; background:var(--bg); display:none; flex-direction:column; }
  #gifStatus{ font-size:13px; color:var(--muted); text-align:center; }
  #gifPreviewImg{ max-width:100%; border-radius:12px; margin-top:14px; display:none; border:1px solid var(--line); }
  #gifActionBar{ display:flex; gap:10px; padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 18px); border-top:1px solid var(--line); }
  #gifActionBar .dangerbtn{ flex:1; text-align:center; }
  #gifCreateBtn:disabled{ opacity:.5; }

  /* photo viewer */
  #viewer{
    position:absolute; inset:0; z-index:30; background:#000; display:none;
    flex-direction:column;
  }
  #viewerImgWrap{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:12px 28px; overflow:hidden; min-height:0; position:relative;
    touch-action:none; /* JS fully handles pinch-zoom/pan/swipe; don't let the browser intercept any of it */
  }
  #viewerImgWrap img{
    max-width:100%; max-height:100%; width:auto; height:auto;
    object-fit:contain; border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    -webkit-user-drag:none; user-select:none; -webkit-touch-callout:none;
  }
  #viewerBar{
    display:flex; justify-content:space-between; align-items:center;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
  }
  #viewerFoot{
    padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
    display:flex; justify-content:space-between; align-items:center;
  }
  #viewerFoot .date{ font-size:13px; color:var(--muted); font-weight:600;}
  .dangerbtn{
    background:rgba(255,91,76,.12); border:1px solid rgba(255,91,76,.4); color:var(--alert);
    padding:9px 16px; border-radius:100px; font-size:13px; font-weight:700;
  }

  /* permission sheet */
  #permissionSheet{ align-items:center; justify-content:center; text-align:center; padding:0 30px;}
  #permissionSheet .badge{
    width:64px; height:64px; border-radius:20px; background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 18px;
  }
  #permissionSheet h1{ font-family:'Archivo Black',sans-serif; font-size:19px; margin:0 0 10px;}
  #permissionSheet p{ color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 22px;}
  #permBtn{
    background:var(--accent); color:#0A0B0D; border:none; padding:14px 28px;
    border-radius:100px; font-weight:700; font-size:15px; font-family:'Space Grotesk',sans-serif;
  }
  #permErr{ color:var(--alert); font-size:12px; margin-top:14px; display:none;}

  .langBtn{
    flex:1; padding:12px; border-radius:10px; font-weight:700; font-size:14px;
    background:var(--card); border:1.5px solid var(--line); color:var(--text);
    font-family:'Space Grotesk',sans-serif;
  }
  .langBtn.active{ background:var(--accent); color:#0A0B0D; border-color:var(--accent); }
</style>
</head>
<body>
<div id="app">

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="work"></canvas>
    <canvas id="capture"></canvas>
    <div id="poseGuide" aria-hidden="true">
      <div class="guideLabel" id="poseGuideLabel"></div>
      <div class="headGuide"></div>
      <div class="bodyGuide"></div>
      <div class="guideLine shoulderLine"></div>
      <div class="guideLine centerLine"></div>
    </div>
    <div id="flash"></div>
    <div id="toast"><div class="dot"></div><span id="toastText"></span></div>
    <div id="countdownOverlay"><div id="countdownNum">3</div></div>

    <div id="topbar">
      <div class="pill"><div class="dot" id="streakDot"></div><span id="streakText"></span></div>
      <button class="iconbtn" id="galleryBtn">▤</button>
    </div>

    <div id="ringWrap">
      <svg viewBox="0 0 220 220">
        <circle id="ringBg" cx="110" cy="110" r="100"></circle>
        <circle id="ringFg" cx="110" cy="110" r="100"></circle>
      </svg>
      <div id="ringLabel">
        <div class="state" id="stateText"></div>
        <div class="sub" id="subText"></div>
      </div>
    </div>

    <div id="bottom">
      <div id="strip"></div>
      <div id="controls">
        <button class="ctrlbtn" id="flipBtn">⟲</button>
        <button id="shutter"></button>
        <button class="ctrlbtn" id="settingsBtn">⚙</button>
      </div>
      <div id="modeLabel"></div>
    </div>
  </div>

  <!-- Permission -->
  <div id="permissionSheet">
    <div>
      <div class="badge">📷</div>
      <h1 id="permHeadingText"></h1>
      <p id="permBodyText"></p>
      <button id="permBtn"></button>
      <div id="permErr"></div>
    </div>
  </div>

  <!-- Settings -->
  <div id="settingsSheet">
    <div class="sheetHead"><h2 id="settingsTitleText"></h2><button class="closebtn" id="closeSettings">✕</button></div>
    <div class="sheetBody">
      <div class="row">
        <label><span id="lblHoldTime"></span> <span class="val" id="holdVal"></span></label>
        <input type="range" id="holdSlider" min="1" max="5" step="1" value="2">
      </div>
      <div class="row">
        <label><span id="lblSens"></span> <span class="val" id="sensVal"></span></label>
        <input type="range" id="sensSlider" min="1" max="9" value="5">
      </div>
      <div class="row">
        <label><span id="lblCooldown"></span> <span class="val" id="cooldownVal"></span></label>
        <input type="range" id="cooldownSlider" min="2" max="10" value="4">
      </div>
      <div class="row">
        <label><span id="lblQuality"></span></label>
        <select id="qualitySelect" style="width:100%; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:14px; font-family:'Space Grotesk',sans-serif;">
          <option value="standard" id="optQualityStandard"></option>
          <option value="high" id="optQualityHigh"></option>
          <option value="ultra" id="optQualityUltra"></option>
        </select>
      </div>
      <div class="row">
        <label><span id="lblCamera"></span></label>
        <select id="cameraSelect" style="width:100%; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:14px; font-family:'Space Grotesk',sans-serif;">
          <option value="user" id="optCameraFront"></option>
          <option value="environment" id="optCameraRear"></option>
        </select>
      </div>
      <div class="row">
        <label><span id="lblShutterType"></span></label>
        <select id="shutterTypeSelect" style="width:100%; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:14px; font-family:'Space Grotesk',sans-serif;">
          <option value="film" id="optFilm"></option>
          <option value="digital" id="optDigital"></option>
          <option value="mute" id="optMute"></option>
        </select>
      </div>
      <div class="row">
        <label><span id="lblShutterVol"></span> <span class="val" id="shutterVolVal"></span></label>
        <input type="range" id="shutterVolSlider" min="0" max="100" value="85">
      </div>
      <div class="row">
        <label><span id="lblLanguage"></span></label>
        <div style="display:flex; gap:8px;">
          <button class="langBtn" id="langBtnEn">English</button>
          <button class="langBtn" id="langBtnKo">한국어</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Gallery -->
  <div id="gallerySheet">
    <div class="sheetHead">
      <h2 id="galleryTitleText"></h2>
      <div style="display:flex; gap:6px;">
        <button class="closebtn" id="selectModeBtn" style="font-size:14px;"></button>
        <button class="closebtn" id="closeGallery">✕</button>
      </div>
    </div>
    <div class="sheetBody">
      <div id="galGrid"></div>
      <div id="galEmpty"></div>
    </div>
    <div id="galSelectBar">
      <span id="galSelectCount"></span>
      <div style="display:flex; gap:8px;">
        <button class="dangerbtn" id="galMakeGif" style="background:rgba(200,255,61,.12); border-color:rgba(200,255,61,.4); color:var(--accent);" disabled></button>
        <button class="dangerbtn" id="galDeleteSelected" disabled></button>
      </div>
    </div>
  </div>

  <!-- GIF maker -->
  <div id="gifSheet">
    <div class="sheetHead"><h2 id="gifTitleText"></h2><button class="closebtn" id="closeGifSheet">✕</button></div>
    <div class="sheetBody">
      <div class="row">
        <label><span id="lblGifDelay"></span><span class="val" id="gifDelayVal"></span></label>
        <input type="range" id="gifDelaySlider" min="150" max="1000" step="50" value="400">
      </div>
      <div class="row" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <label for="gifAlignToggle" style="margin:0;"><span id="lblGifAlign"></span></label>
        <input type="checkbox" id="gifAlignToggle" checked style="width:22px;height:22px;accent-color:var(--accent);">
      </div>
      <div id="gifStatus"></div>
      <img id="gifPreviewImg">
    </div>
    <div id="gifActionBar">
      <button class="dangerbtn" id="gifCreateBtn" style="background:rgba(200,255,61,.12); border-color:rgba(200,255,61,.4); color:var(--accent);"></button>
      <button class="dangerbtn" id="gifSaveBtn" style="display:none; background:rgba(200,255,61,.12); border-color:rgba(200,255,61,.4); color:var(--accent);"></button>
    </div>
  </div>

  <!-- Viewer -->
  <div id="viewer">
    <div id="viewerBar">
      <button class="closebtn" id="closeViewer">✕</button>
    </div>
    <div id="viewerImgWrap"><img id="viewerImg" src="" draggable="false"></div>
    <div id="viewerFoot">
      <div class="date" id="viewerDate"></div>
      <div style="display:flex; gap:8px;">
        <button class="dangerbtn" id="saveDevicePhoto" style="background:rgba(200,255,61,.12); border-color:rgba(200,255,61,.4); color:var(--accent);"></button>
        <button class="dangerbtn" id="deletePhoto"></button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  const video = document.getElementById('video');
  const work = document.getElementById('work');
  const capture = document.getElementById('capture');
  const poseGuide = document.getElementById('poseGuide');
  const poseGuideLabel = document.getElementById('poseGuideLabel');
  let captureReferenceAnchor = null;
  let guideAnchor = null;
  let guideCheckBusy = false;
  let guideLastCheck = 0;
  let guideGood = false;

  const wctx = work.getContext('2d', {willReadFrequently:true});
  const flashEl = document.getElementById('flash');
  const ringFg = document.getElementById('ringFg');
  const stateText = document.getElementById('stateText');
  const subText = document.getElementById('subText');
  const shutterBtn = document.getElementById('shutter');
  const streakText = document.getElementById('streakText');
  const strip = document.getElementById('strip');

  // ---------- i18n ----------
  const translations = {
    en: {
      title: 'Just Pose',
      streakStart: 'Start your streak',

  // Default language is English; falls back to a saved choice if present.
  let lang = 'en';
  try{
    const saved = localStorage.getItem('still_lang');
    if(saved === 'en' || saved === 'ko') lang = saved;
  }catch(e){}

  function t(key){ return translations[lang][key]; }

  // Small pill notification (e.g. "Photo saved") that fades in and
  // auto-dismisses after ~1 second. Uses inline styles directly rather
  // than a CSS class toggle, so it can't be silently defeated by any
  // other rule's specificity.
  let toastTimer = null;
  function showToast(msg){
    const toast = document.getElementById('toast');
    document.getElementById('toastText').textContent = msg;
    clearTimeout(toastTimer);
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(-50%) translateY(0)';
    toastTimer = setTimeout(()=>{
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(-50%) translateY(-8px)';
    }, 1000);
  }

  const RING_CIRC = 628;
  work.width = 64; work.height = 48;

  let stream = null;
  let facingMode = 'user'; // 기본: 전면 카메라
  let holdMs = 2000;       // slider default 2 -> *1000
  let sensitivity = 5;     // 1..9, higher = more sensitive (smaller threshold)
  let cooldownMs = 4000;
  let shutterType = 'film';  // 'film' | 'digital' | 'mute'
  let shutterVolume = 0.85;  // 0..1
  let qualityPreset = 'high'; // 'standard' | 'high' | 'ultra'
  const QUALITY_PRESETS = {
    standard: { w:1080, h:1440, jpeg:0.90 },
    high:     { w:1920, h:2560, jpeg:0.97 },
    ultra:    { w:2880, h:3840, jpeg:0.985 },
  };
  let lastFrame = null;
  let stillSince = null;
  let cooldownUntil = 0;
  let armed = true;
  let loopHandle = null;
  let capturing = false; // true while the 3-2-1 countdown / capture is in progress
  let cameraActive = false;   // true once the camera has successfully started
  let countdownInterval = null; // handle for the 3-2-1 countdown, so it can be cancelled

  // ---------- Storage helpers (IndexedDB — works standalone, no external platform needed) ----------
  const DB_NAME = 'still-photos-db';
  const STORE_NAME = 'photos';
  let dbPromise = null;

  function getDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve,reject)=>{
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = ()=>{
        req.result.createObjectStore(STORE_NAME);
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
    return dbPromise;
  }
  async function storeGet(key){
    try{
      const db = await getDB();
      return await new Promise((resolve)=>{
        const tx = db.transaction(STORE_NAME,'readonly');
        const r = tx.objectStore(STORE_NAME).get(key);
        r.onsuccess = ()=> resolve(r.result || null);
        r.onerror = ()=> resolve(null);
      });
    }catch(e){ return null; }
  }
  async function storeSet(key,val){
    try{
      const db = await getDB();
      await new Promise((resolve,reject)=>{
        const tx = db.transaction(STORE_NAME,'readwrite');
        tx.objectStore(STORE_NAME).put(val,key);
        tx.oncomplete = resolve;
        tx.onerror = ()=> reject(tx.error);
      });
    }catch(e){ console.error('storeSet failed', e); }
  }
  async function storeDelete(key){
    try{
      const db = await getDB();
      await new Promise((resolve)=>{
        const tx = db.transaction(STORE_NAME,'readwrite');
        tx.objectStore(STORE_NAME).delete(key);
        tx.oncomplete = resolve;
        tx.onerror = resolve;
      });
    }catch(e){}
  }

  let index = []; // [{key, ts}]

  async function loadIndex(){
    const raw = await storeGet('photo-index');
    index = raw ? JSON.parse(raw) : [];
    index.sort((a,b)=> b.ts - a.ts);
  }
  async function saveIndex(){
    await storeSet('photo-index', JSON.stringify(index));
  }

  function fmtDate(ts){
    const d = new Date(ts);
    return `${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  function computeStreak(){
    if(index.length===0) return 0;
    const days = new Set(index.map(p=>{
      const d = new Date(p.ts);
      return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    }));
    let streak=0;
    let cursor = new Date();
    while(true){
      const key = `${cursor.getFullYear()}-${cursor.getMonth()}-${cursor.getDate()}`;
      if(days.has(key)){ streak++; cursor.setDate(cursor.getDate()-1); }
      else break;
    }
    return streak;
  }

  function renderStreak(){
    const s = computeStreak();
    streakText.textContent = s>0 ? t('streakCount')(s) : t('streakStart');
  }

  async function renderStrip(){
    strip.innerHTML = '';
    const recent = index.slice(0,10);
    for(let i=0; i<recent.length; i++){
      const p = recent[i];
      const val = await storeGet(p.key);
      if(!val) continue;
      const div = document.createElement('div');
      div.className='thumb';
      const img = document.createElement('img');
      img.src = val;
      div.appendChild(img);
      div.onclick = ()=> openViewer(p, i); // recent[i] === index[i], same position
      strip.appendChild(div);
    }
  }

  // ---------- Camera ----------
  async function startCamera(){
    try{
      if(stream){ stream.getTracks().forEach(t=>t.stop()); }
      const q = QUALITY_PRESETS[qualityPreset] || QUALITY_PRESETS.high;
      stream = await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode, width:{ideal:q.w, min:640}, height:{ideal:q.h, min:480}, resizeMode:'none',
          // Ask for continuous autofocus/exposure/white-balance up front.
          // Browsers that don't recognize these simply ignore them, so this
          // is safe even on devices/browsers without camera-control support.
          focusMode:{ideal:'continuous'},
          exposureMode:{ideal:'continuous'},
          whiteBalanceMode:{ideal:'continuous'}
        },
        audio:false
      });
      video.srcObject = stream;
      video.classList.toggle('mirror', facingMode==='user');
      document.getElementById('permissionSheet').style.display='none';
      lastFrame = null; stillSince = null;
      cameraActive = true;

      // Belt-and-suspenders: explicitly (re)apply continuous autofocus via
      // the track's own constraints too, since some devices only honor it
      // this way rather than through the initial getUserMedia request.
      try{
        const track = stream.getVideoTracks()[0];
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        const advanced = {};
        if(caps.width && caps.width.max) advanced.width = caps.width.max;
        if(caps.height && caps.height.max) advanced.height = caps.height.max;
        if(caps.noiseReductionMode && caps.noiseReductionMode.includes('highQuality')) advanced.noiseReductionMode = 'highQuality';
        if(caps.edgeEnhancementMode && caps.edgeEnhancementMode.includes('highQuality')) advanced.edgeEnhancementMode = 'highQuality';
        if(caps.focusMode && caps.focusMode.includes('continuous')) advanced.focusMode = 'continuous';
        if(caps.exposureMode && caps.exposureMode.includes('continuous')) advanced.exposureMode = 'continuous';
        if(caps.whiteBalanceMode && caps.whiteBalanceMode.includes('continuous')) advanced.whiteBalanceMode = 'continuous';
        if(Object.keys(advanced).length){ try{ await track.applyConstraints({advanced:[advanced]}); }catch(e){ console.warn('optional camera enhancement constraints unavailable', e); } }
      }catch(e){
        console.warn('could not explicitly set continuous autofocus', e);
      }

      if(!loopHandle) loopHandle = requestAnimationFrame(tick);
    }catch(e){
      cameraActive = false;
      document.getElementById('permissionSheet').style.display='flex';
      document.getElementById('permErr').style.display='block';
    }
  }

  // Fully releases the camera hardware and stops all processing — used when
  // the screen turns off / the app goes to the background, so the camera
  // isn't running (and draining battery / recording) while unattended.
  function stopCamera(){
    if(loopHandle){ cancelAnimationFrame(loopHandle); loopHandle = null; }
    if(countdownInterval){ clearInterval(countdownInterval); countdownInterval = null; }
    document.getElementById('countdownOverlay').style.display = 'none';
    capturing = false;
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
    video.srcObject = null;
    lastFrame = null; stillSince = null;
    captureReferenceAnchor = null; guideAnchor = null; guideGood = false;
    updateGuideVisual(null);
  }

  // Pause/resume around screen-off, app backgrounding, and tab switching.
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){
      if(cameraActive) stopCamera();
    } else {
      if(cameraActive && !stream) startCamera();
    }
  });
  window.addEventListener('pagehide', ()=>{
    if(cameraActive) stopCamera();
  });

  // ---------- Framing guide / position lock ----------
  function normalizedAnchor(a, w, h){
    if(!a || !w || !h) return null;
    return {cx:a.cx/w, cy:a.cy/h, fw:a.w/w, fh:a.h/h, bodyH:a.h/h, bodyW:a.w/w, faceW:(a.fw||a.w)/w, faceH:(a.fh||a.h)/h};
  }

  function updateGuideVisual(anchor){
    if(!poseGuideLabel) return;
    if(!anchor){
      poseGuide.classList.remove('locked');
      poseGuide.classList.remove('warning');
      poseGuideLabel.textContent = t('poseGuide');
      guideGood = false;
      return;
    }
    let good = true;
    if(captureReferenceAnchor){
      const dx=Math.abs(anchor.cx-captureReferenceAnchor.cx);
      const dy=Math.abs(anchor.cy-captureReferenceAnchor.cy);
      const ds=Math.abs(Math.log(Math.max(.001,anchor.bodyH)/Math.max(.001,captureReferenceAnchor.bodyH)));
      const dw=Math.abs(Math.log(Math.max(.001,anchor.bodyW)/Math.max(.001,captureReferenceAnchor.bodyW)));
      // Body height is the primary scale reference; width is secondary because
      // arm position can change substantially between poses.
      good = dx < .055 && dy < .055 && ds < .10 && dw < .18;
    } else {
      // Before the first shot, keep the whole body centered in the guide.
      good = anchor.cx > .30 && anchor.cx < .70 && anchor.cy > .18 && anchor.cy < .62 && anchor.bodyH > .30 && anchor.bodyH < .88;
    }
    poseGuide.classList.toggle('locked', good);
    poseGuide.classList.toggle('warning', !good);
    poseGuideLabel.textContent = good ? t('poseGuideGood') : t('poseGuideMove');
    guideGood = good;
  }

  async function checkGuidePosition(now){
    if(guideCheckBusy || now-guideLastCheck < 500 || capturing || video.readyState < 2) return;
    guideLastCheck=now; guideCheckBusy=true;
    try{
      const a=await detectPersonAnchor(video);
      guideAnchor=normalizedAnchor(a, video.videoWidth||work.width, video.videoHeight||work.height);
      updateGuideVisual(guideAnchor);
    }catch(e){
      guideAnchor=null;
      updateGuideVisual(null);
    }finally{ guideCheckBusy=false; }
  }

  // ---------- Motion detection loop ----------
  function tick(){
    loopHandle = requestAnimationFrame(tick);
    if(video.readyState < 2) return;
    checkGuidePosition(performance.now());
    if(capturing) return; // countdown or capture in progress — don't fight it with new triggers
    if(gallerySheet.style.display === 'flex' || viewer.style.display === 'flex' || settingsSheet.style.display === 'flex') return; // paused while reviewing photos or in settings

    wctx.drawImage(video, 0, 0, work.width, work.height);
    const frame = wctx.getImageData(0,0,work.width,work.height).data;

    if(lastFrame){
      let diff = 0;
      for(let i=0;i<frame.length;i+=4){
        diff += Math.abs(frame[i]-lastFrame[i]);
      }
      const avgDiff = diff / (frame.length/4); // 0..255ish
      const threshold = 12 - sensitivity; // higher sensitivity -> lower threshold
      const now = performance.now();

      if(now < cooldownUntil){
        // cooling down after a capture
        setRing(0, 'cool');
      } else if(avgDiff < Math.max(threshold,1)){
        if(stillSince === null) stillSince = now;
        const held = now - stillSince;
        const pct = Math.min(held / holdMs, 1);
        setRing(pct, 'still');
        if(pct >= 1){
          if(!captureReferenceAnchor || guideGood){
            startCaptureSequence();
          } else {
            stillSince = now;
            setRing(0, 'moving');
          }
        }
      } else {
        stillSince = null;
        setRing(0, 'moving');
      }
    }
    lastFrame = frame;
  }

  let lastRingPct = 0, lastRingMode = 'moving';
  function setRing(pct, mode){
    lastRingPct = pct; lastRingMode = mode;
    const offset = RING_CIRC * (1-pct);
    ringFg.style.strokeDashoffset = offset;
    if(mode==='still'){
      ringFg.style.stroke = pct>0.7 ? 'var(--accent)' : 'var(--accent-dim)';
      stateText.textContent = pct>=1 ? t('stateCaptured') : t('stateStillHold');
      subText.textContent = pct>=1 ? '' : t('subStillHold');
      shutterBtn.classList.toggle('armed', pct>0.15);
    } else if(mode==='cool'){
      ringFg.style.stroke = 'var(--muted)';
      stateText.textContent = t('stateCool');
      subText.textContent = t('subCool');
      shutterBtn.classList.remove('armed');
    } else {
      ringFg.style.stroke = 'var(--accent)';
      stateText.textContent = t('stateIdle');
      subText.textContent = t('subIdle');
      shutterBtn.classList.remove('armed');
    }
  }

  // Shows a 3-2-1 countdown on screen, plays a shutter click on the actual
  // capture frame, then takes the photo. Used for both auto (still-pose)
  // and manual (shutter button) captures.
  function startCaptureSequence(){
    if(capturing) return;
    capturing = true;
    stillSince = null;

    const overlay = document.getElementById('countdownOverlay');
    const numEl = document.getElementById('countdownNum');
    stateText.textContent = t('statePrep');
    subText.textContent = t('subPrep');
    overlay.style.display = 'flex';

    let n = 3;
    const showNum = ()=>{
      numEl.textContent = String(n);
      numEl.style.animation = 'none';
      void numEl.offsetWidth; // restart the pulse animation each tick
      numEl.style.animation = 'countPulse .9s ease-out';
    };
    showNum();
    speakCountdown(n);

    countdownInterval = setInterval(()=>{
      n--;
      if(n > 0){
        showNum();
        speakCountdown(n);
      } else {
        clearInterval(countdownInterval);
        countdownInterval = null;
        overlay.style.display = 'none';
        playShutterSound();
        doCapture().finally(()=>{
          capturing = false;
          lastFrame = null; // fresh baseline so we don't false-trigger right after
        });
      }
    }, 1000);
  }

  // Spoken 3-2-1 countdown. Uses the browser/device's speech engine so
  // Korean says "삼, 이, 일" and English says "three, two, one".
  function speakCountdown(n){
    if(!('speechSynthesis' in window)) return;
    try{
      window.speechSynthesis.cancel();
      const words = lang === 'ko'
        ? {3:'삼', 2:'이', 1:'일'}
        : {3:'three', 2:'two', 1:'one'};
      const u = new SpeechSynthesisUtterance(words[n] || String(n));
      u.lang = lang === 'ko' ? 'ko-KR' : 'en-US';
      u.rate = lang === 'ko' ? 0.9 : 0.85;
      u.pitch = 1.0;
      u.volume = n === 3
        ? Math.max(0.35, Math.min(1, shutterVolume * 0.65))
        : Math.max(0.5, Math.min(1, shutterVolume));
      window.speechSynthesis.speak(u);
    }catch(e){ console.warn('countdown speech failed', e); }
  }

  // Shutter sound. Two flavors, both synthesized via WebAudio (no external
  // audio file, so it works identically in the browser and inside the APK):
  //  - 'film': two filtered-noise bursts mimicking a mechanical SLR's
  //    mirror-flip + shutter-close "clack-clack".
  //  - 'digital': a brighter two-tone electronic beep.
  // Overall level is boosted vs. the original and scaled by shutterVolume.
  function playShutterSound(){
    if(shutterType === 'mute' || shutterVolume <= 0) return;
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const actx = new Ctx();
      const now = actx.currentTime;

      const master = actx.createGain();
      master.gain.value = shutterVolume;
      master.connect(actx.destination);

      function noiseClick(start, duration, filterFreq, q, peakGain){
        const len = Math.max(1, Math.floor(actx.sampleRate * duration));
        const buffer = actx.createBuffer(1, len, actx.sampleRate);
        const data = buffer.getChannelData(0);
        for(let i=0;i<len;i++){ data[i] = Math.random()*2-1; }

        const noise = actx.createBufferSource();
        noise.buffer = buffer;

        const filter = actx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = filterFreq;
        filter.Q.value = q;

        const gain = actx.createGain();
        gain.gain.setValueAtTime(0.0001, now + start);
        gain.gain.exponentialRampToValueAtTime(peakGain, now + start + 0.004);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + start + duration);

        noise.connect(filter); filter.connect(gain); gain.connect(master);
        noise.start(now + start);
        noise.stop(now + start + duration + 0.01);
      }

      function tone(freq, start, dur, peakGain){
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, now + start);
        gain.gain.setValueAtTime(0.0001, now + start);
        gain.gain.exponentialRampToValueAtTime(peakGain, now + start + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
        osc.connect(gain); gain.connect(master);
        osc.start(now + start);
        osc.stop(now + start + dur + 0.02);
      }

      if(shutterType === 'digital'){
        tone(1900, 0,    0.05, 0.85);
        tone(1000, 0.06, 0.08, 0.65);
      } else {
        // 'film' (default): mirror-flip click, then shutter-close click ~90ms later
        noiseClick(0,    0.05, 3200, 1.1, 0.95);
        noiseClick(0.09, 0.07, 1700, 0.9, 0.75);
      }
    }catch(e){ console.warn('shutter sound failed', e); }
  }

  async function doCapture(){
    cooldownUntil = performance.now() + cooldownMs;
    stillSince = null;

    const ts = Date.now();
    const q = QUALITY_PRESETS[qualityPreset] || QUALITY_PRESETS.high;

    // Try to grab a real still photo straight from the camera sensor via
    // ImageCapture — this is what native camera apps use, and gives much
    // higher resolution/sharpness than snapshotting the live preview video
    // (which is capped low for smooth real-time playback). Falls back to
    // the old video-frame snapshot if the API/device doesn't support it.
    let sourceImg = null, srcW = 0, srcH = 0;
    try{
      const track = stream && stream.getVideoTracks()[0];
      if(track && 'ImageCapture' in window){
        const imageCapture = new ImageCapture(track);

        // The video preview stream is capped at whatever resolution we
        // requested for smooth playback — the camera's actual still-photo
        // pipeline is often capable of much more. Ask for its true max.
        let opts = {};
        let caps = null;
        try{
          caps = await imageCapture.getPhotoCapabilities();
          if(caps && caps.imageWidth && caps.imageHeight){
            opts = { imageWidth: caps.imageWidth.max, imageHeight: caps.imageHeight.max };
          }
        }catch(e){
          console.warn('getPhotoCapabilities unavailable, using default takePhoto size', e);
        }

        let blob;
        try { blob = await imageCapture.takePhoto(opts); }
        catch(e) {
          const safeOpts = {};
          if(caps && caps.imageWidth && caps.imageWidth.max) safeOpts.imageWidth = caps.imageWidth.max;
          if(caps && caps.imageHeight && caps.imageHeight.max) safeOpts.imageHeight = caps.imageHeight.max;
          blob = await imageCapture.takePhoto(safeOpts);
        }
        sourceImg = await createImageBitmap(blob);
        srcW = sourceImg.width; srcH = sourceImg.height;
      }
    }catch(e){
      console.warn('ImageCapture.takePhoto failed, falling back to video frame', e);
      sourceImg = null;
    }
    if(!sourceImg){
      sourceImg = video;
      srcW = video.videoWidth || q.w; srcH = video.videoHeight || q.h;
    }

    // The first successful capture becomes the framing reference. Later
    // automatic captures are allowed only while the live subject stays
    // close to this position/size.
    if(!captureReferenceAnchor){
      try{
        const a=await detectPersonAnchor(sourceImg);
        captureReferenceAnchor=normalizedAnchor(a, srcW, srcH);
        updateGuideVisual(captureReferenceAnchor);
      }catch(e){ /* visual guide still works */ }
    }

    // Downscale to the selected quality preset's target size (skip for
    // 'ultra', which always keeps the full sensor resolution).
    let vw = srcW, vh = srcH;
    if(qualityPreset !== 'ultra' && vh > q.h){
      const scale = q.h / vh;
      vw = Math.round(vw * scale);
      vh = q.h;
    }

    capture.width = vw; capture.height = vh;
    const cctx = capture.getContext('2d');
    if(facingMode==='user'){
      cctx.translate(vw,0); cctx.scale(-1,1);
    }
    // Web camera capture skips the computational-photography pipeline native
    // camera apps use (multi-frame merge, tuned contrast/sharpening), so the
    // raw sensor frame looks flatter and softer by comparison. This gives
    // it a gentle boost in the same direction — a bit more contrast/
    // saturation while drawing, then an edge-sharpening pass afterward —
    // to partially close that gap.
    cctx.filter = 'contrast(1.03) saturate(1.04) brightness(1.01)';
    cctx.drawImage(sourceImg,0,0,vw,vh);
    cctx.filter = 'none';
    sharpenCanvas(cctx, vw, vh);
    drawTimestamp(cctx, vw, vh, ts);
    const dataUrl = capture.toDataURL('image/jpeg', q.jpeg);

    flashEl.style.opacity = '1';
    setTimeout(()=> flashEl.style.opacity='0', 90);

    const key = 'photo:'+ts;
    await storeSet(key, dataUrl);
    index.unshift({key, ts});
    await saveIndex();
    renderStreak();
    renderStrip();
    // NOTE: no longer auto-triggering a device download here.
    // Chrome silently blocks downloads that aren't tied to a direct user
    // click, which is exactly what happens on auto-capture (still-pose
    // detection) — so it looked like a "저장 안 됨" bug with no error.
    // Photos stay safe in the in-app gallery (IndexedDB); tapping
    // "폰에 저장" in the viewer IS a direct click and saves reliably.
  }

  // Burns the capture timestamp into the bottom of the photo itself,
  // so it travels with the image no matter where it ends up.
  // Simple single-pass edge-sharpening (Laplacian-based unsharp mask) run
  // directly on the canvas pixel data. Native camera apps apply sharpening
  // as part of their image pipeline; this approximates that for a photo
  // captured through the web camera API, which doesn't get any of that
  // processing on its own.
  function sharpenCanvas(cctx, w, h, amount){
    amount = amount == null ? (w >= 2500 ? 0.22 : w >= 1800 ? 0.28 : 0.34) : amount;
    if(w < 3 || h < 3) return; // too small to matter, avoid edge-case math
    let imgData;
    try{
      imgData = cctx.getImageData(0, 0, w, h);
    }catch(e){
      console.warn('sharpenCanvas: could not read pixel data, skipping', e);
      return;
    }
    const src = imgData.data;
    const out = new Uint8ClampedArray(src); // start as a copy; only interior pixels get rewritten
    const stride = w * 4;

    for(let y = 1; y < h - 1; y++){
      let i = (y * w + 1) * 4;
      for(let x = 1; x < w - 1; x++, i += 4){
        out[i]   = src[i]   + amount * (4*src[i]   - src[i-stride]   - src[i+stride]   - src[i-4]   - src[i+4]);
        out[i+1] = src[i+1] + amount * (4*src[i+1] - src[i-stride+1] - src[i+stride+1] - src[i-4+1] - src[i+4+1]);
        out[i+2] = src[i+2] + amount * (4*src[i+2] - src[i-stride+2] - src[i+stride+2] - src[i-4+2] - src[i+4+2]);
      }
    }

    imgData.data.set(out);
    cctx.putImageData(imgData, 0, 0);
  }

  function drawTimestamp(cctx, vw, vh, ts){
    cctx.setTransform(1,0,0,1,0,0); // undo any mirror transform first
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    const text = `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}  ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

    const fontSize = Math.max(22, Math.round(vw * 0.032));
    cctx.font = `600 ${fontSize}px 'Space Grotesk', sans-serif`;
    cctx.textBaseline = 'alphabetic';

    const padX = fontSize * 0.9;
    const padY = fontSize * 0.9;
    const boxH = fontSize + padY * 1.4;

    // gradient scrim so text stays readable on any background
    const grad = cctx.createLinearGradient(0, vh - boxH * 1.6, 0, vh);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.55)');
    cctx.fillStyle = grad;
    cctx.fillRect(0, vh - boxH * 1.6, vw, boxH * 1.6);

    cctx.fillStyle = '#F3F4F1';
    cctx.fillText(text, padX, vh - padY);
  }

  async function saveToDevice(dataUrl, ts){
    const d = new Date(ts);
    const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}`;
    const filename = `STILL_${stamp}.jpg`;

    // Path 1: plain <a download>. Now that the app runs as a real PWA/TWA
    // (actual Chrome engine, not a bare Appilix WebView), this saves the
    // file directly to the device's Downloads folder immediately — no
    // share-sheet prompt, no extra tap.
    try{
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast(t('savedDeviceToast'));
      return;
    }catch(e){
      console.warn('direct download failed, falling back to share sheet', e);
    }

    // Path 2: Web Share API — only used as a fallback if the direct
    // download somehow isn't available (e.g. an unusual embedded browser).
    try{
      const res = await fetch(dataUrl);
      const blob = await res.blob();
      const file = new File([blob], filename, {type: 'image/jpeg'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title: filename});
        showToast(t('savedDeviceToast'));
        return;
      }
    }catch(e){
      // user cancelling the share sheet also lands here (AbortError) — not a real failure
      if(e && e.name === 'AbortError') return;
      console.error('device save failed completely', e);
      alert(t('saveFailedAlert'));
    }
  }

  // Generic version of saveToDevice's save logic, for blobs that aren't a
  // plain JPEG data URL (e.g. an encoded GIF). Same two-path strategy:
  // direct <a download> first, then Web Share API as a fallback.
  async function saveBlobToDevice(blob, filename, toastMsg){
    try{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=> URL.revokeObjectURL(url), 4000);
      showToast(toastMsg);
      return;
    }catch(e){
      console.warn('direct download failed, falling back to share sheet', e);
    }
    try{
      const file = new File([blob], filename, {type: blob.type || 'application/octet-stream'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title: filename});
        showToast(toastMsg);
        return;
      }
    }catch(e){
      if(e && e.name === 'AbortError') return;
      console.error('device save failed completely', e);
      alert(t('saveFailedAlert'));
    }
  }

  // ---------- Person/body alignment ----------
  // Uses the face as a reliable landmark when FaceDetector is available, then
  // expands it into a conservative full-body box. This keeps the capture guide
  // based on the person's overall framing instead of only the face.
  // The estimated box is intentionally tolerant of arm/leg movement.
  let faceDetectorInstance = null;
  function getFaceDetector(){
    try{
      if(!('FaceDetector' in window)) return null;
      if(!faceDetectorInstance) faceDetectorInstance = new FaceDetector({fastMode:true, maxDetectedFaces:1});
      return faceDetectorInstance;
    }catch(e){ return null; }
  }

  function makeBodyAnchor(cx, cy, faceW, faceH, imgW, imgH, source){
    // Typical standing framing: the body is roughly 3.8 face-widths wide and
    // 7.5 face-heights tall. Clamp to the image so extreme close-ups don't
    // produce an unusably large box.
    const bw = Math.min(imgW * 0.82, Math.max(faceW * 3.8, faceH * 2.4));
    const bh = Math.min(imgH * 0.92, Math.max(faceH * 7.5, faceW * 4.8));
    const bodyCx = Math.max(bw/2, Math.min(imgW-bw/2, cx));
    const top = Math.max(0, cy - faceH*1.15);
    const bodyCy = Math.max(bh/2, Math.min(imgH-bh/2, top + bh/2));
    return {cx:bodyCx, cy:bodyCy, w:bw, h:bh, fw:faceW, fh:faceH, source};
  }

  async function detectPersonAnchor(img){
    const detector = getFaceDetector();
    if(detector){
      try{
        const faces = await detector.detect(img);
        if(faces && faces.length){
          const r = faces[0].boundingBox;
          return makeBodyAnchor(
            r.x+r.width/2, r.y+r.height/2,
            r.width, r.height,
            img.width, img.height, 'pose-face'
          );
        }
      }catch(e){ /* fall through to lightweight fallback */ }
    }

    // Fallback: find a likely head/skin patch, then build the same body box.
    // This keeps the feature usable on browsers without FaceDetector.
    try{
      const c = document.createElement('canvas');
      const W=160, H=Math.max(90, Math.round(160*img.height/img.width));
      c.width=W; c.height=H;
      const x=c.getContext('2d',{willReadFrequently:true});
      x.drawImage(img,0,0,W,H);
      const d=x.getImageData(0,0,W,H).data;
      const skin=new Uint8Array(W*H);
      for(let y=0;y<H*0.48;y++){
        for(let xx=Math.round(W*0.18);xx<Math.round(W*0.82);xx++){
          const i=(y*W+xx)*4, r=d[i], g=d[i+1], b=d[i+2];
          const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
          const looksSkin = r>55 && g>30 && b>18 && r>g*1.06 && g>b*1.04 && (r-b)>22 && (mx-mn)>18;
          if(looksSkin) skin[y*W+xx]=1;
        }
      }
      const integral=new Uint32Array((W+1)*(H+1));
      for(let y=0;y<H;y++){
        let row=0;
        for(let xx=0;xx<W;xx++){
          row += skin[y*W+xx];
          integral[(y+1)*(W+1)+(xx+1)] = integral[y*(W+1)+(xx+1)] + row;
        }
      }
      let best=null;
      for(const win of [14,18,22,26]){
        for(let y=8;y<Math.floor(H*0.44);y+=3){
          for(let xx=Math.floor(W*0.22);xx<=Math.floor(W*0.72);xx+=3){
            const x2=Math.min(W,xx+win), y2=Math.min(H,y+win);
            const sum=integral[y2*(W+1)+x2]-integral[y*(W+1)+x2]-integral[y2*(W+1)+xx]+integral[y*(W+1)+xx];
            const area=(x2-xx)*(y2-y);
            const score=sum/area;
            if(!best || score>best.score) best={score,x:xx,y,win};
          }
        }
      }
      if(best && best.score>0.20){
        const fx=(best.x+best.win/2)*img.width/W;
        const fy=(best.y+best.win/2)*img.height/H;
        const fw=best.win*img.width/W;
        const fh=best.win*img.height/H;
        return makeBodyAnchor(fx,fy,fw,fh,img.width,img.height,'pose-skin');
      }
    }catch(e){ /* no alignment data */ }
    return null;
  }

  async function prepareGifAlignment(imgs, gw, gh){
    const anchors=[];
    for(const im of imgs) anchors.push(await detectPersonAnchor(im));
    const ref=anchors[0];
    if(!ref) return {anchors, ref:null};
    return {anchors, ref};
  }

  async function buildGif(){
    if(typeof GIF === 'undefined'){
      gifStatus.textContent = t('gifFailedAlert');
      return;
    }
    if(gifKeysSnapshot.length < 2){
      gifStatus.textContent = t('gifMinPhotosAlert');
      return;
    }

    gifCreateBtn.disabled = true;
    gifSaveBtn.style.display = 'none';
    gifPreviewImg.style.display = 'none';
    gifStatus.textContent = t('gifCreatingStatus');

    // Declared here (function scope), not inside try{}, so it's reachable
    // from the catch block below as well as from gif.js's async 'error'
    // event. Previously this lived inside try{} and was invisible to
    // catch{}, so any failure before the encoder was created (worker fetch,
    // image decode, etc.) threw a second, unhandled ReferenceError instead
    // of showing a message — leaving the button stuck disabled forever.
    let gifErrorShown = false;
    const showGifError = (err)=>{
      if(gifErrorShown) return;
      gifErrorShown = true;
      const msg = String(err && err.message || err || 'Unknown error');
      console.error('gif encoder error:', err);
      const friendly = /worker|download|fetch|HTTP/i.test(msg) ? t('gifWorkerFailedAlert') : t('gifFailedAlert');
      // Keep the exact browser/encoder error visible so it can be read.
      gifStatus.textContent = friendly + '  [' + msg + ']';
      gifStatus.style.whiteSpace = 'pre-wrap';
      gifStatus.style.userSelect = 'text';
      gifCreateBtn.disabled = false;
      setTimeout(()=>{
        try{ alert(friendly + '\n\n오류 내용:\n' + msg); }catch(_){}
      }, 100);
    };

    try{
      const dataUrls = [];
      for(const key of gifKeysSnapshot){
        const val = await storeGet(key);
        if(val) dataUrls.push(val);
      }
      if(dataUrls.length < 2){
        gifStatus.textContent = t('gifMinPhotosAlert');
        gifCreateBtn.disabled = false;
        return;
      }

      const imgs = await Promise.all(dataUrls.map(src => new Promise((resolve, reject)=>{
        const im = new Image();
        im.onload = ()=> resolve(im);
        im.onerror = reject;
        im.src = src;
      })));

      // Photos can be up to 2880px on the long edge (ultra quality) — far
      // more detail than a GIF needs. Capping this keeps file size and
      // encode time reasonable.
      const MAX_EDGE = 640;
      const first = imgs[0];
      const scale = Math.min(1, MAX_EDGE / Math.max(first.width, first.height));
      const gw = Math.round(first.width * scale);
      const gh = Math.round(first.height * scale);

      const gifCanvas = document.createElement('canvas');
      gifCanvas.width = gw; gifCanvas.height = gh;
      const gctx = gifCanvas.getContext('2d');

      // gif.js workers can fail when the worker script itself is cross-origin.
      // Fetch it first and create a same-origin Blob URL for the Worker.
      const workerScript = await getGifWorkerUrl();
      const gif = new GIF({
        workers: 2,
        quality: 10,
        width: gw,
        height: gh,
        workerScript
      });

      const delay = Number(gifDelaySlider.value);
      const alignment = gifAlignToggle.checked ? await prepareGifAlignment(imgs, gw, gh) : {anchors:[], ref:null};
      const ref = alignment.ref;
      const refBaseScale = ref ? Math.max(gw / imgs[0].width, gh / imgs[0].height) : 1;
      const refBaseW = imgs[0].width * refBaseScale, refBaseH = imgs[0].height * refBaseScale;
      const targetCx = ref ? ref.cx * refBaseScale + (gw-refBaseW)/2 : gw/2;
      const targetCy = ref ? ref.cy * refBaseScale + (gh-refBaseH)/2 : gh*0.34;
      const targetBodyH = ref ? Math.max(80, Math.min(gh*0.82, ref.h*refBaseScale)) : 0;
      let alignedCount = 0;
      for(let idx=0; idx<imgs.length; idx++){
        const im = imgs[idx];
        gctx.setTransform(1,0,0,1,0,0);
        gctx.fillStyle = '#000';
        gctx.fillRect(0, 0, gw, gh);

        // First normalize each source image to the GIF canvas. Then, when a
        // face/person anchor is available, apply a uniform scale + translation
        // so the person's body stays at the same location and size as frame 1.
        const baseScale = Math.max(gw / im.width, gh / im.height);
        const baseW = im.width * baseScale, baseH = im.height * baseScale;
        let tx=(gw-baseW)/2, ty=(gh-baseH)/2, sc=baseScale;

        const a=alignment.anchors[idx];
        if(ref && a){
          const desiredScale = targetBodyH / Math.max(1, a.h*baseScale);
          const personScale = Math.max(0.82, Math.min(1.22, desiredScale));
          sc = baseScale * personScale;
          const ax = a.cx * sc, ay = a.cy * sc;
          tx = targetCx - ax;
          ty = targetCy - ay;
          alignedCount++;
        }
        gctx.setTransform(sc,0,0,sc,tx,ty);
        gctx.drawImage(im,0,0);
        gctx.setTransform(1,0,0,1,0,0);
        gif.addFrame(gctx, {copy:true, delay});
      }
      if(gifAlignToggle.checked){
        gifStatus.textContent = alignedCount >= 2
          ? (t('gifAlignStatus') + ` (${alignedCount}/${imgs.length})`)
          : t('gifAlignFallbackStatus');
      }

      gif.on('finished', (blob)=>{
        gifBlob = blob;
        gifPreviewImg.src = URL.createObjectURL(blob);
        gifPreviewImg.style.display = 'block';
        gifStatus.textContent = t('gifDoneStatus');
        gifSaveBtn.style.display = 'block';
        gifCreateBtn.disabled = false;
      });
      // gif.js worker failures are asynchronous, so they do not reach the
      // try/catch above. Listen for the encoder's error event as well.
      gif.on('error', showGifError);
      gif.render();
    }catch(e){
      showGifError(e);
    }
  }
  gifCreateBtn.onclick = buildGif;

  window.addEventListener('pagehide', ()=>{ if(gifWorkerUrl){ URL.revokeObjectURL(gifWorkerUrl); gifWorkerUrl = null; } });

  gifSaveBtn.onclick = ()=>{
    if(!gifBlob) return;
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}`;
    saveBlobToDevice(gifBlob, `JustPose_${stamp}.gif`, t('savedGifToast'));
  };

  let currentIndex = -1; // position of currentViewing within the `index` array
  let zoomScale = 1, panX = 0, panY = 0; // pinch-zoom / pan state for the viewer image

  function resetZoom(){
    zoomScale = 1; panX = 0; panY = 0;
    viewerImg.style.transform = 'none';
  }

  // Loads a photo into the single viewer <img>. `fromDx` (if given) is the
  // pixel offset the outgoing photo should slide out toward, so the new one
  // can slide in from the opposite side — purely a single-element transform/
  // opacity animation, no neighbor pre-loading or multi-slide track involved.
  async function showPhotoAt(idx, fromDx){
    if(idx < 0 || idx >= index.length) return; // out of range — no wrap, just ignore
    const p = index[idx];
    const val = await storeGet(p.key);
    if(!val) return;
    currentIndex = idx;
    currentViewing = p;
    resetZoom();

    if(fromDx){
      const w = document.getElementById('viewerImgWrap').getBoundingClientRect().width || 300;
      const dir = fromDx < 0 ? -1 : 1; // which way the OLD photo exited
      viewerImg.style.transition = 'transform .16s ease, opacity .16s ease';
      viewerImg.style.transform = `translateX(${dir * w * 0.4}px)`;
      viewerImg.style.opacity = '0';
      await new Promise(r => setTimeout(r, 160));

      viewerImg.src = val;
      viewerDate.textContent = fmtDate(p.ts);
      viewerImg.style.transition = 'none';
      viewerImg.style.transform = `translateX(${-dir * w * 0.4}px)`;
      void viewerImg.offsetWidth; // force reflow before animating in
      viewerImg.style.transition = 'transform .16s ease, opacity .16s ease';
      viewerImg.style.transform = 'translateX(0)';
      viewerImg.style.opacity = '1';
    } else {
      viewerImg.src = val;
      viewerDate.textContent = fmtDate(p.ts);
      viewerImg.style.transition = 'none';
      viewerImg.style.transform = 'none';
      viewerImg.style.opacity = '1';
    }
  }

  async function openViewer(p, idx){
    if(idx == null) idx = index.findIndex(x => x.key === p.key);
    if(idx === -1 || idx == null) return;
    viewer.style.display='flex';
    history.pushState({modal:'viewer'}, '');
    await showPhotoAt(idx);
  }

  // Photo viewer gestures, all via Pointer Events (unifies touch/mouse/pen):
  //  - One finger, not zoomed: swipe past the threshold to move to the next/
  //    previous photo, which slides/fades in.
  //  - Two fingers: pinch to zoom (1x–4x).
  //  - One finger, zoomed in: drag to pan around the photo.
  (function setupViewerGestures(){
    const wrap = document.getElementById('viewerImgWrap');
    const pointers = new Map(); // pointerId -> {x,y}
    let pinchStartDist = 0, pinchStartScale = 1;
    let panStart = null;   // {x,y,panX,panY} — active when panning a zoomed photo
    let swipeStart = null; // {x,y} — active when dragging to navigate (not zoomed)

    function dist(a, b){
      const dx = a.x-b.x, dy = a.y-b.y;
      return Math.sqrt(dx*dx + dy*dy);
    }
    function applyZoomTransform(){
      viewerImg.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
    }

    wrap.addEventListener('pointerdown', (e)=>{
      wrap.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

      if(pointers.size === 2){
        const pts = [...pointers.values()];
        pinchStartDist = dist(pts[0], pts[1]);
        pinchStartScale = zoomScale;
        panStart = null; swipeStart = null;
      } else if(pointers.size === 1){
        if(zoomScale > 1){
          panStart = {x:e.clientX, y:e.clientY, panX, panY};
        } else {
          swipeStart = {x:e.clientX, y:e.clientY};
        }
      }
    });

    wrap.addEventListener('pointermove', (e)=>{
      if(!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

      if(pointers.size === 2 && pinchStartDist > 0){
        const pts = [...pointers.values()];
        const d = dist(pts[0], pts[1]);
        zoomScale = Math.min(4, Math.max(1, pinchStartScale * (d / pinchStartDist)));
        applyZoomTransform();
      } else if(pointers.size === 1 && panStart){
        panX = panStart.panX + (e.clientX - panStart.x);
        panY = panStart.panY + (e.clientY - panStart.y);
        applyZoomTransform();
      }
    });

    function onPointerEnd(e){
      if(pointers.size === 1 && swipeStart && zoomScale === 1){
        const dx = e.clientX - swipeStart.x;
        const dy = e.clientY - swipeStart.y;
        if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.3){
          if(dx < 0) showPhotoAt(currentIndex + 1, dx); // swipe left -> next (older)
          else showPhotoAt(currentIndex - 1, dx);       // swipe right -> prev (newer)
        }
      }
      pointers.delete(e.pointerId);
      if(pointers.size < 2) pinchStartDist = 0;
      if(pointers.size === 0){
        swipeStart = null; panStart = null;
        if(zoomScale <= 1) resetZoom();
      }
    }
    wrap.addEventListener('pointerup', onPointerEnd);
    wrap.addEventListener('pointercancel', onPointerEnd);
  })();

  document.getElementById('saveDevicePhoto').onclick = ()=>{
    if(!currentViewing) return;
    viewerImg.src && saveToDevice(viewerImg.src, currentViewing.ts);
  };
  document.getElementById('deletePhoto').onclick = async ()=>{
    if(!currentViewing) return;
    await storeDelete(currentViewing.key);
    index = index.filter(x=>x.key!==currentViewing.key);
    await saveIndex();
    history.back(); // closes the viewer (consumes the state pushed by openViewer)
    renderStreak(); renderStrip();
    if(gallerySheet.style.display === 'flex') openGallery();
  };
  document.getElementById('closeViewer').onclick = ()=> history.back();
  document.getElementById('galleryBtn').onclick = ()=>{
    history.pushState({modal:'gallery'}, '');
    openGallery();
  };
  document.getElementById('closeGallery').onclick = ()=> history.back();

  // ---------- Settings ----------
  const settingsSheet = document.getElementById('settingsSheet');
  document.getElementById('settingsBtn').onclick = ()=>{
    history.pushState({modal:'settings'}, '');
    settingsSheet.style.display='flex';
  };
  document.getElementById('closeSettings').onclick = ()=> history.back();

  // The Android back button (and browser back gesture) fires popstate rather
  // than closing the app — as long as we've pushed a history entry for
  // whatever's open. This closes the top-most visible sheet instead of
  // exiting to the home screen. If nothing is open, we do nothing here and
  // let the normal back/exit behavior proceed.
  window.addEventListener('popstate', ()=>{
    if(gifSheet.style.display === 'flex'){
      gifSheet.style.display = 'none';
      gifBlob = null;
      return;
    }
    if(viewer.style.display === 'flex'){
      viewer.style.display = 'none';
      lastFrame = null; stillSince = null;
      return;
    }
    if(gallerySheet.style.display === 'flex'){
      gallerySheet.style.display = 'none';
      selectMode = false;
      selectedKeys.clear();
      selectModeBtn.textContent = t('selectBtnOn');
      lastFrame = null; stillSince = null;
      return;
    }
    if(settingsSheet.style.display === 'flex'){
      settingsSheet.style.display = 'none';
      lastFrame = null; stillSince = null;
      return;
    }
  });

  const holdSlider = document.getElementById('holdSlider');
  const holdVal = document.getElementById('holdVal');
  function updateHoldVal(){
    holdVal.textContent = `${holdSlider.value}${t('secShort')}`;
  }
  function updateModeLabel(){
    document.getElementById('modeLabel').textContent = t('modeLabel')(holdSlider.value);
  }
  holdSlider.oninput = ()=>{
    holdMs = holdSlider.value * 1000;
    updateHoldVal();
    updateModeLabel();
  };

  const sensSlider = document.getElementById('sensSlider');
  const sensVal = document.getElementById('sensVal');
  function updateSensVal(){
    sensVal.textContent = t('sensLabels')[sensitivity-1] || t('sensLabels')[4];
  }
  sensSlider.oninput = ()=>{
    sensitivity = Number(sensSlider.value);
    updateSensVal();
  };

  const cooldownSlider = document.getElementById('cooldownSlider');
  const cooldownVal = document.getElementById('cooldownVal');
  function updateCooldownVal(){
    cooldownVal.textContent = `${cooldownSlider.value}${t('secShort')}`;
  }
  cooldownSlider.oninput = ()=>{
    cooldownMs = cooldownSlider.value * 1000;
    updateCooldownVal();
  };

  const cameraSelect = document.getElementById('cameraSelect');
  cameraSelect.value = facingMode;
  cameraSelect.onchange = ()=>{
    facingMode = cameraSelect.value;
    if(cameraActive) startCamera();
  };

  const shutterTypeSelect = document.getElementById('shutterTypeSelect');
  shutterTypeSelect.value = shutterType;
  shutterTypeSelect.onchange = ()=>{
    shutterType = shutterTypeSelect.value;
    if(shutterType !== 'mute') playShutterSound(); // quick preview
  };

  const shutterVolSlider = document.getElementById('shutterVolSlider');
  const shutterVolVal = document.getElementById('shutterVolVal');
  shutterVolSlider.oninput = ()=>{
    shutterVolume = shutterVolSlider.value / 100;
    shutterVolVal.textContent = shutterVolSlider.value+'%';
  };
  shutterVolSlider.onchange = ()=>{
    if(shutterType !== 'mute') playShutterSound(); // quick preview at new volume
  };

  const qualitySelect = document.getElementById('qualitySelect');
  qualitySelect.value = qualityPreset;
  qualitySelect.onchange = ()=>{
    qualityPreset = qualitySelect.value;
    if(cameraActive) startCamera(); // re-request the stream at the new resolution
  };

  const langBtnEn = document.getElementById('langBtnEn');
  const langBtnKo = document.getElementById('langBtnKo');
  function setLanguage(newLang){
    lang = newLang;
    try{ localStorage.setItem('still_lang', lang); }catch(e){}
    applyLanguage();
  }
  langBtnEn.onclick = ()=> setLanguage('en');
  langBtnKo.onclick = ()=> setLanguage('ko');

  // Fills in every static (non-dynamic-count) piece of UI text for the
  // current language, then refreshes the dynamic bits (streak, sliders,
  // select bar, current ring state) so nothing is left in the old language.
  function applyLanguage(){
    document.title = t('title');
    document.documentElement.lang = lang;

    document.getElementById('permHeadingText').textContent = t('permHeading');
    document.getElementById('permBodyText').innerHTML = t('permBody');
    document.getElementById('permBtn').textContent = t('permBtn');
    document.getElementById('permErr').textContent = t('permErr');

    document.getElementById('settingsTitleText').textContent = t('settingsTitle');
    document.getElementById('lblHoldTime').textContent = t('holdTimeLabel');
    document.getElementById('lblSens').textContent = t('sensLabel');
    document.getElementById('lblCooldown').textContent = t('cooldownLabel');
    document.getElementById('lblShutterType').textContent = t('shutterTypeLabel');
    document.getElementById('optFilm').textContent = t('shutterFilm');
    document.getElementById('optDigital').textContent = t('shutterDigital');
    document.getElementById('optMute').textContent = t('shutterMute');
    document.getElementById('lblQuality').textContent = t('qualityLabel');
    document.getElementById('optQualityStandard').textContent = t('qualityStandard');
    document.getElementById('optQualityHigh').textContent = t('qualityHigh');
    document.getElementById('optQualityUltra').textContent = t('qualityUltra');
    document.getElementById('lblShutterVol').textContent = t('shutterVolLabel');
    document.getElementById('lblLanguage').textContent = t('languageLabel');

    document.getElementById('galleryTitleText').textContent = t('galleryTitle');
    selectModeBtn.textContent = selectMode ? t('selectBtnOff') : t('selectBtnOn');
    galEmpty.innerHTML = t('galEmpty');
    galDeleteSelected.textContent = t('deleteBtn');

    document.getElementById('saveDevicePhoto').textContent = t('saveDeviceBtn');
    document.getElementById('deletePhoto').textContent = t('deleteBtn');

    galMakeGif.textContent = t('makeGifBtn');
    document.getElementById('gifTitleText').textContent = t('gifTitle');
    document.getElementById('lblGifDelay').textContent = t('gifDelayLabel');
    gifCreateBtn.textContent = t('gifCreateBtn');
    gifSaveBtn.textContent = t('saveDeviceBtn');

    updateHoldVal();
    updateSensVal();
    updateCooldownVal();
    updateModeLabel();
    updateSelectBar();
    renderStreak();
    setRing(lastRingPct, lastRingMode); // refresh whichever state text is currently shown

    langBtnEn.classList.toggle('active', lang==='en');
    langBtnKo.classList.toggle('active', lang==='ko');
  }

  // ---------- Controls ----------
  document.getElementById('flipBtn').onclick = ()=>{
    facingMode = facingMode==='user' ? 'environment' : 'user';
    cameraSelect.value = facingMode;
    startCamera();
  };
  shutterBtn.onclick = manualCapture;
  document.getElementById('permBtn').onclick = ()=>{
    document.getElementById('permErr').style.display='none';
    startCamera();
  };

  // ---------- PWA: service worker registration ----------
  // Lets the app install as a standalone app and load instantly / work
  // offline after the first visit. Safe to skip silently if unsupported.
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(e=> console.warn('SW registration failed', e));
    });
  }

  // ---------- Init ----------
  (async function init(){
    applyLanguage();
    await loadIndex();
    renderStreak();
    await renderStrip();
    document.getElementById('permissionSheet').style.display='flex';
  })();

})();
</script>
</body>
</html>
